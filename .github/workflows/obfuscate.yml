name: Auto Obfuscate Script

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Obfuscate with API
        env:
          API_KEY: ${{ secrets.OBFUSCATOR_KEY }}
        run: |
          mkdir -p dist
          
          SESSION_ID=$(curl -s -X POST https://api.luaobfuscator.com/v1/obfuscator/newscript \
            -H "content-type: text/plain" \
            -H "apikey: $API_KEY" \
            --data-binary "@main.lua" | jq -r '.sessionId')

          curl -s -X POST https://api.luaobfuscator.com/v1/obfuscator/obfuscate \
            -H "content-type: application/json" \
            -H "apikey: $API_KEY" \
            -H "sessionId: $SESSION_ID" \
            -d '{"MinifyAll":true}' | jq -r '.code' > dist/protected.lua

      - name: Commit & Push to 'build' Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto Obfuscated Update"
          branch: build
          create_branch: true
          file_pattern: "dist/protected.lua"
          
